{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if object %}Edit task{% else %}New task{% endif %} | Client tasks</title>
    <link rel="stylesheet" href="{% static 'core/landing.css' %}">
    {{ form.media }}
</head>
<body class="auth-page">
    <main class="login-panel task-form-panel">
        <a class="back-link" href="{% url 'project-list' %}">← Back to projects</a>
        <p class="eyebrow">Client workspace</p>
        <h1>{% if object %}Edit task{% else %}Create a task{% endif %}</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="primary-button primary-button--full" type="submit">{% if object %}Save changes{% else %}Create task{% endif %}</button>
        </form>
    </main>
</body>
</html>
