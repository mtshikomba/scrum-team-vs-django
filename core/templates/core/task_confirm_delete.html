{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete task | Client tasks</title>
    <link rel="stylesheet" href="{% static 'core/landing.css' %}">
</head>
<body class="auth-page action-page">
    <div class="page-shell">
        <header class="topbar"><a class="brand" href="{% url 'client-landing' %}"><span class="brand-mark">CT</span><span>Client tasks</span></a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="text-button" type="submit">Sign out</button></form></header>
    <main class="login-panel">
        <a class="back-link" href="{{ task.get_absolute_url }}">← Keep task</a>
        <p class="eyebrow">Delete task</p>
        <h1>Delete “{{ task.title }}”?</h1>
        <p class="form-note">This action cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <button class="danger-button primary-button--full" type="submit">Delete task</button>
        </form>
    </main>
    </div>
</body>
</html>
