{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | Client tasks</title>
    <link rel="stylesheet" href="{% static 'core/landing.css' %}">
</head>
<body class="auth-page">
    <main class="login-panel">
        <span class="brand-mark">CT</span>
        <p class="eyebrow">Client workspace</p>
        <h1>Create your account</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="primary-button primary-button--full" type="submit">Create account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
    </main>
</body>
</html>
